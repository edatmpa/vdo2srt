[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdo2srt"
version = "2.0.0"
description = "Convert video/audio files to SRT subtitle files using Whisper or Google Cloud STT"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
keywords = ["subtitle", "srt", "whisper", "transcription", "speech-to-text"]
authors = [
    {name = "SaksiriK"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper",
    "tqdm",
    "deep-translator",
]

[project.optional-dependencies]
cloud = [
    "google-cloud-speech",
    "google-auth",
]

[project.urls]
Homepage = "https://github.com/SaksiriK/create-EN-SRT-from-video-sound-track"
Repository = "https://github.com/SaksiriK/create-EN-SRT-from-video-sound-track"

[project.scripts]
vdo2srt = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
